version: "2"

sql:
  # Users 
  - engine: postgresql
    schema: "db/migrations"
    queries: "internal/modules/users/infra/postgres/queries"
    gen:
      go:
        package: "usersqlc"
        out: "internal/modules/users/infra/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
